name: crypto_signal_scanner
description: Persian-first private crypto signal scanner.
publish_to: 'none'
version: 0.2.6+8

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  crypto: ^3.0.5
  flutter_secure_storage: ^9.2.2
  flutter_local_notifications: ^17.2.4
  workmanager: ^0.10.9
  # FCM client — live push requires google-services.json + FCM_SERVER_KEY (ENV)
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
