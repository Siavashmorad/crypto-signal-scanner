services:
  - type: web
    name: crypto-signal-scanner-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SIGNAL_SCANNER_USERNAME
        sync: false
      - key: SIGNAL_SCANNER_PASSWORD_HASH
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: OPENAI_RESPONSES_URL
        value: https://api.openai.com/v1/responses
      # paper = virtual positions after your approve
      # live_with_approval = real Tabdeal orders only after your approve
      # signal_only = no trading at all
      - key: EXECUTION_MODE
        value: paper
      - key: TABDEAL_API_KEY
        sync: false
      - key: TABDEAL_API_SECRET
        sync: false
