services:
  - type: web
    name: crypto-signal-scanner-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SIGNAL_SCANNER_USERNAME
        sync: false
      - key: SIGNAL_SCANNER_PASSWORD_HASH
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: OPENAI_RESPONSES_URL
        value: https://api.openai.com/v1/responses
      - key: EXECUTION_MODE
        value: live_with_approval
      - key: TABDEAL_API_KEY
        sync: false
      - key: TABDEAL_API_SECRET
        sync: false
      - key: MAX_OPEN_POSITIONS
        value: "3"
      - key: MAX_POSITION_NOTIONAL_USDT
        value: "50"
      - key: MAX_DAILY_LOSS_USDT
        value: "30"
      - key: TRADINGVIEW_WEBHOOK_SECRET
        sync: false
