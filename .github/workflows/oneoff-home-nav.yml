name: One-off Home Navigation Patch

on:
  push:
    branches: [feat/futures-wallet-execution]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/futures-wallet-execution
          fetch-depth: 0
      - name: Apply minimal Home patch
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/widgets/home_page.dart')
          text = p.read_text(encoding='utf-8')
          if "import 'home_nav_section.dart';" not in text:
              anchor = "import 'wallet_page.dart';\n"
              if anchor not in text:
                  raise SystemExit('SAFE STOP: wallet_page import anchor missing')
              text = text.replace(anchor, anchor + "import 'home_nav_section.dart';\n", 1)
          if 'HomeNavSection(english: en)' not in text:
              anchor = "              Card(\n                color: tabdealLinked"
              idx = text.find(anchor)
              if idx < 0:
                  raise SystemExit('SAFE STOP: Home Tabdeal card anchor missing')
              text = text[:idx] + "              HomeNavSection(english: en),\n" + text[idx:]
          if text.count("import 'home_nav_section.dart';") != 1:
              raise SystemExit('SAFE STOP: import count is not exactly one')
          if text.count('HomeNavSection(english: en)') != 1:
              raise SystemExit('SAFE STOP: widget count is not exactly one')
          p.write_text(text, encoding='utf-8')
      - name: Verify file integrity
        run: |
          test -s lib/widgets/home_page.dart
          grep -q "import 'home_nav_section.dart';" lib/widgets/home_page.dart
          grep -q "HomeNavSection(english: en)" lib/widgets/home_page.dart
          if grep -q "export 'home_page_impl.dart';" lib/widgets/home_page.dart; then exit 1; fi
      - name: Commit patch and remove one-off workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/widgets/home_page.dart
          git commit -m 'feat(home): add analysis and MT5 navigation cards' || exit 1
          git rm .github/workflows/oneoff-home-nav.yml
          git commit -m 'chore(ci): remove one-off home navigation patch workflow'
          git push origin feat/futures-wallet-execution
