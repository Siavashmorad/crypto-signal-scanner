name: Repair Coin Analysis Integration
on:
  push:
    branches: [feat/futures-wallet-execution]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.5
          channel: stable
          cache: true
      - name: Patch source safely
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('lib/services/coin_analysis_service.dart')
          s = p.read_text()
          s = s.replace("import 'market_analysis_engine.dart';\n", '')
          s = s.replace("import 'market_regime.dart';\n", '')
          s = s.replace('final reward = ((tp2 ?? lastPrice) - lastPrice).abs();', 'final reward = (tp2 - lastPrice).abs();')
          s = s.replace('if (rr != null && rr < 1.2) {', 'if (rr < 1.2) {')
          p.write_text(s)

          p = Path('lib/widgets/home_page.dart')
          s = p.read_text()
          import_line = "import 'coin_analysis_page.dart';\n"
          if import_line not in s:
              marker = "import 'ai_performance_page.dart';\n"
              if marker not in s:
                  raise SystemExit('HomePage import anchor not found')
              s = s.replace(marker, marker + import_line, 1)

          old = """            IconButton(\n              onPressed: () {\n                Navigator.of(context).push(MaterialPageRoute(\n                  builder: (_) => AiPerformancePage(english: en),\n                ));\n              },\n              icon: const Icon(Icons.analytics_outlined),\n            ),\n"""
          new = old + """            IconButton(\n              tooltip: en ? 'Coin analysis' : 'تحلیل ارز',\n              onPressed: () {\n                Navigator.of(context).push(MaterialPageRoute(\n                  builder: (_) => CoinAnalysisPage(english: en),\n                ));\n              },\n              icon: const Icon(Icons.search),\n            ),\n"""
          if 'CoinAnalysisPage(' not in s:
              if old not in s:
                  raise SystemExit('HomePage analytics button anchor not found')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          dart format lib/services/coin_analysis_service.dart lib/widgets/home_page.dart
          grep -q "import 'coin_analysis_page.dart';" lib/widgets/home_page.dart
          grep -q 'CoinAnalysisPage(' lib/widgets/home_page.dart
          ! grep -E 'PLACEHOLDER|LOADING_FROM_ARTIFACT|TRUNCATED|channel truncated' lib/widgets/home_page.dart
      - name: Verify and test
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/services/coin_analysis_service.dart lib/widgets/home_page.dart
          git rm .github/workflows/auto_repair_coin_analysis.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: connect Coin Analysis tab and clear analyzer blockers"
          git push origin HEAD:feat/futures-wallet-execution
