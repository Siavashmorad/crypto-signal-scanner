name: Build Android Release

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

jobs:
  quality-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: |
          flutter create . --platforms=android --project-name crypto_signal_scanner
          rm -f test/widget_test.dart
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          if 'android.permission.INTERNET' not in text:
              marker = '<manifest '
              start = text.find(marker)
              end = text.find('>', start)
              if start == -1 or end == -1:
                  raise SystemExit('AndroidManifest.xml: manifest element not found')
              text = text[:end + 1] + '\n    <uses-permission android:name="android.permission.INTERNET" />' + text[end + 1:]
          text, replacements = re.subn(
              r'android:label="[^"]*"',
              'android:label="سیگنال‌یاب"',
              text,
              count=1,
          )
          if replacements != 1:
              raise SystemExit('AndroidManifest.xml: application label not found')
          manifest.write_text(text, encoding='utf-8')
          print('Verified INTERNET permission and application label: سیگنال‌یاب')
          PY

      - name: Get packages
        run: flutter pub get

      - name: Format source
        run: |
          dart format lib test
          dart format --output=none --set-exit-if-changed lib test

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Flutter tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release --dart-define=AI_BACKEND_URL=${{ vars.AI_BACKEND_URL }}

      - name: Build release App Bundle
        run: flutter build appbundle --release --dart-define=AI_BACKEND_URL=${{ vars.AI_BACKEND_URL }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: crypto-signal-scanner-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: crypto-signal-scanner-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
