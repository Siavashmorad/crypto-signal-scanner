name: Build Android Release

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

jobs:
  quality-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: |
          flutter create . --platforms=android --project-name crypto_signal_scanner
          rm -f test/widget_test.dart
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          text = p.read_text()
          permission = '    <uses-permission android:name="android.permission.INTERNET" />\n'
          if 'android.permission.INTERNET' not in text:
              marker = '<manifest '
              start = text.find(marker)
              end = text.find('>', start)
              if start == -1 or end == -1:
                  raise SystemExit('AndroidManifest.xml: manifest element not found')
              text = text[:end + 1] + '\n' + permission + text[end + 1:]
          old = 'android:label="crypto_signal_scanner"'
          if old in text:
              text = text.replace(old, 'android:label="سیگنال‌یاب"', 1)
          elif 'android:label=' in text:
              import re
              text = re.sub(r'android:label="[^"]*"', 'android:label="سیگنال‌یاب"', text, count=1)
          else:
              text = text.replace('<application ', '<application android:label="سیگنال‌یاب" ', 1)
          p.write_text(text)
          print('Verified INTERNET permission and SignalYab Android label')
          PY

      - name: Get packages
        run: flutter pub get

      - name: Format source
        run: dart format lib test

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Flutter tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release --dart-define=AI_BACKEND_URL=${{ vars.AI_BACKEND_URL }}

      - name: Build release App Bundle
        run: flutter build appbundle --release --dart-define=AI_BACKEND_URL=${{ vars.AI_BACKEND_URL }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: crypto-signal-scanner-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: crypto-signal-scanner-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
