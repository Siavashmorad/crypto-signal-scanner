name: Build Android Release

on:
  push:
    branches: [main, 'feature/**', 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:

jobs:
  quality-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Generate Android platform files
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          flutter create . --platforms=android --project-name crypto_signal_scanner
          rm -f test/widget_test.dart
          python3 scripts/ci_android_setup.py

      - name: Get packages
        run: flutter pub get

      - name: Format source
        run: |
          dart format lib test
          dart format --output=none --set-exit-if-changed lib test

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Flutter tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release --dart-define=AI_BACKEND_URL=${{ vars.AI_BACKEND_URL }}

      - name: Build release App Bundle
        run: flutter build appbundle --release --dart-define=AI_BACKEND_URL=${{ vars.AI_BACKEND_URL }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: crypto-signal-scanner-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: crypto-signal-scanner-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
