name: Build Android Release

on:
  push:
    branches: [main, 'feature/**', 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:

jobs:
  quality-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: |
          flutter create . --platforms=android --project-name crypto_signal_scanner
          rm -f test/widget_test.dart
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          for perm in [
              'android.permission.INTERNET',
              'android.permission.ACCESS_NETWORK_STATE',
              'android.permission.POST_NOTIFICATIONS',
              'android.permission.VIBRATE',
              'android.permission.RECEIVE_BOOT_COMPLETED',
          ]:
              if perm not in text:
                  marker = '<manifest '
                  start = text.find(marker)
                  end = text.find('>', start)
                  text = text[:end + 1] + f'\n    <uses-permission android:name="{perm}" />' + text[end + 1:]

          # Ensure application can use cleartext + network security config
          if 'android:usesCleartextTraffic' not in text:
              text = text.replace(
                  '<application',
                  '<application android:usesCleartextTraffic="true"',
                  1,
              )
          text, n = re.subn(
              r'android:label="[^"]*"',
              'android:label="سیگنال‌یاب"',
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit('label not found')
          manifest.write_text(text, encoding='utf-8')

          # Network security: trust system CAs (default) + cleartext for debug paths
          res = Path('android/app/src/main/res/xml')
          res.mkdir(parents=True, exist_ok=True)
          (res / 'network_security_config.xml').write_text(
              '''<?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
            <base-config cleartextTrafficPermitted="true">
              <trust-anchors>
                <certificates src="system" />
                <certificates src="user" />
              </trust-anchors>
            </base-config>
            <domain-config cleartextTrafficPermitted="true">
              <domain includeSubdomains="true">tabdeal.org</domain>
              <domain includeSubdomains="true">api1.tabdeal.org</domain>
              <domain includeSubdomains="true">api.tabdeal.org</domain>
              <domain includeSubdomains="true">binance.com</domain>
            </domain-config>
          </network-security-config>
          ''',
              encoding='utf-8',
          )
          # Attach networkSecurityConfig on application if missing
          m = manifest.read_text(encoding='utf-8')
          if 'networkSecurityConfig' not in m:
              m = m.replace(
                  '<application',
                  '<application android:networkSecurityConfig="@xml/network_security_config"',
                  1,
              )
              manifest.write_text(m, encoding='utf-8')
          print('Android network + notification permissions applied')
          PY

      - name: Get packages
        run: flutter pub get

      - name: Format source
        run: |
          dart format lib test
          dart format --output=none --set-exit-if-changed lib test

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Flutter tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release --dart-define=AI_BACKEND_URL=${{ vars.AI_BACKEND_URL }}

      - name: Build release App Bundle
        run: flutter build appbundle --release --dart-define=AI_BACKEND_URL=${{ vars.AI_BACKEND_URL }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: crypto-signal-scanner-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: crypto-signal-scanner-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
